<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yara Kids - ABC & 123</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b6b">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f308.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui}
  body{background:#FFF8E7;min-height:100vh}
  header{background:#FF6B6B;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
  header h1{font-size:28px} header p{opacity:.9;font-size:14px}
  .tabs{display:flex;gap:8px;padding:12px;overflow:auto;background:white;box-shadow:0 2px 8px #0001;position:sticky;top:70px;z-index:9}
  .tab{padding:10px 18px;border-radius:20px;border:2px solid #eee;background:white;font-weight:800;white-space:nowrap;cursor:pointer}
  .tab.active{background:#FF6B6B;color:white;border-color:#FF6B6B}
  .page{padding:16px;display:none} .page.active{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:white;border-radius:20px;padding:18px 10px;text-align:center;box-shadow:0 4px 12px #0001;cursor:pointer;transition:.2s;border-bottom:5px solid #eee}
  .card:active{transform:scale(.95)}
  .card .emoji{font-size:42px} .card .letter{font-size:32px;font-weight:900;color:#333}
  .card .word{font-size:13px;color:#666;margin-top:4px;font-weight:700}
  .number-card .dots{font-size:16px;margin-top:6px;word-break:break-all}
  .color-card{height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-weight:900;text-shadow:0 1px 3px #0008;font-size:15px;gap:4px}
  .color-card span.emoji{font-size:26px;text-shadow:none}
  .speak-btn{margin:16px auto;display:block;background:#4ECDC4;color:white;border:none;padding:12px 24px;border-radius:30px;font-weight:800;font-size:16px}
  .parent{margin:20px 16px;background:white;padding:14px;border-radius:16px;text-align:center}
  .hundred{background:linear-gradient(135deg,#FF6B6B,#FFD93D)!important;color:white!important;border-bottom-color:#FF6B6B!important}
  .hundred .letter,.hundred .word,.hundred .dots{color:white!important}
</style>
</head>
<body>
<header>
  <h1>🌈 Yara Kids</h1>
  <p>Tap to hear sound 🔊 — Now 1 to 100!</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('abc', this)">🔤 ABC</button>
  <button class="tab" onclick="showPage('num', this)">🔢 1-100</button>
  <button class="tab active" onclick="showPage('color', this)">🎨 Colors</button>
  <button class="tab" onclick="showPage('animal', this)">🦁 Animals</button>
</div>

<div id="abc" class="page"><div class="grid" id="abcGrid"></div></div>
<div id="num" class="page"><div class="grid" id="numGrid"></div></div>
<div id="color" class="page active"><div class="grid" id="colorGrid"></div></div>
<div id="animal" class="page"><div class="grid" id="animalGrid"></div></div>

<div class="parent">⭐ Today: <span id="learnCount">0</span> words learned — Parent check</div>
<button class="speak-btn" onclick="speak('Hello little star! You are doing great!')">👋 Say Hello</button>

<script>
const abcData = [
  {l:'A',e:'🍎',w:'Apple'},{l:'B',e:'⚽',w:'Ball'},{l:'C',e:'🐱',w:'Cat'},{l:'D',e:'🐶',w:'Dog'},
  {l:'E',e:'🐘',w:'Elephant'},{l:'F',e:'🐟',w:'Fish'},{l:'G',e:'🍇',w:'Grapes'},{l:'H',e:'🏠',w:'House'},
  {l:'I',e:'🍦',w:'Ice Cream'},{l:'J',e:'🧃',w:'Juice'},{l:'K',e:'🪁',w:'Kite'},{l:'L',e:'🦁',w:'Lion'},
  {l:'M',e:'🐒',w:'Monkey'},{l:'N',e:'🥜',w:'Nut'},{l:'O',e:'🍊',w:'Orange'},{l:'P',e:'🐼',w:'Panda'},
  {l:'Q',e:'👑',w:'Queen'},{l:'R',e:'🌈',w:'Rainbow'},{l:'S',e:'☀️',w:'Sun'},{l:'T',e:'🐯',w:'Tiger'},
  {l:'U',e:'☂️',w:'Umbrella'},{l:'V',e:'🎻',w:'Violin'},{l:'W',e:'🐳',w:'Whale'},{l:'X',e:'🎄',w:'Xmas Tree'},
  {l:'Y',e:'🟡',w:'Yellow'},{l:'Z',e:'🦓',w:'Zebra'}
];
// ALL COLORS - 25 colors
const colors = [
  {n:'Red',c:'#FF3B30',e:'❤️'}, {n:'Blue',c:'#007AFF',e:'💙'}, {n:'Green',c:'#34C759',e:'💚'},
  {n:'Yellow',c:'#FFCC00',e:'💛'}, {n:'Orange',c:'#FF9500',e:'🧡'}, {n:'Purple',c:'#AF52DE',e:'💜'},
  {n:'Pink',c:'#FF2D55',e:'💗'}, {n:'Brown',c:'#8B4513',e:'🤎'}, {n:'Black',c:'#000000',e:'🖤'},
  {n:'White',c:'#FFFFFF',e:'🤍',t:'#333'}, {n:'Gray',c:'#8E8E93',e:'🩶'}, {n:'Gold',c:'#FFD700',e:'⭐'},
  {n:'Silver',c:'#C0C0C0',e:'✨'}, {n:'Cyan',c:'#00BCD4',e:'🩵'}, {n:'Lime',c:'#8BC34A',e:'🍋'},
  {n:'Magenta',c:'#E91E63',e:'🌺'}, {n:'Maroon',c:'#800000',e:'🍷'}, {n:'Navy',c:'#001F54',e:'🌌'},
  {n:'Teal',c:'#008080',e:'🦚'}, {n:'Indigo',c:'#3F51B5',e:'🔮'}, {n:'Violet',c:'#9C27B0',e:'☂️'},
  {n:'Lavender',c:'#CE93D8',e:'💐'}, {n:'Peach',c:'#FFCBA4',e:'🍑',t:'#333'}, {n:'Coral',c:'#FF6F61',e:'🪸'},
  {n:'Turquoise',c:'#40E0D0',e:'🌊'}
];
const animals = [
  {n:'Cat',e:'🐱'}, {n:'Dog',e:'🐶'}, {n:'Lion',e:'🦁'}, {n:'Elephant',e:'🐘'}, 
  {n:'Monkey',e:'🐒'}, {n:'Tiger',e:'🐯'}, {n:'Zebra',e:'🦓'}, {n:'Panda',e:'🐼'}, {n:'Fish',e:'🐟'},
  {n:'Cow',e:'🐮'}, {n:'Horse',e:'🐴'}, {n:'Chicken',e:'🐔'}, {n:'Duck',e:'🦆'}, {n:'Sheep',e:'🐑'}, 
  {n:'Pig',e:'🐷'}, {n:'Goat',e:'🐐'}, {n:'Rabbit',e:'🐰'}, {n:'Bear',e:'🐻'},
  {n:'Giraffe',e:'🦒'}, {n:'Hippo',e:'🦛'}, {n:'Crocodile',e:'🐊'}, {n:'Snake',e:'🐍'}, 
  {n:'Turtle',e:'🐢'}, {n:'Frog',e:'🐸'}, {n:'Mouse',e:'🐭'},
  {n:'Parrot',e:'🦜'}, {n:'Owl',e:'🦉'}, {n:'Penguin',e:'🐧'}, {n:'Eagle',e:'🦅'}, 
  {n:'Peacock',e:'🦚'}, {n:'Flamingo',e:'🦩'}, {n:'Bee',e:'🐝'}, {n:'Butterfly',e:'🦋'},
  {n:'Whale',e:'🐳'}, {n:'Dolphin',e:'🐬'}, {n:'Octopus',e:'🐙'}
];

let count=parseInt(localStorage.getItem('yaraCount')||'0');
document.getElementById('learnCount').innerText=count;

function speak(t){ 
  const u = new SpeechSynthesisUtterance(t);
  u.rate=0.8; u.pitch=1.1;
  speechSynthesis.speak(u);
  count++; localStorage.setItem('yaraCount',count);
  document.getElementById('learnCount').innerText=count;
}

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  speak(id==='abc'?'Alphabet':id==='num'?'Numbers one to one hundred':id==='color'?'Colors':'Animals');
}

document.getElementById('abcGrid').innerHTML = abcData.map(i=>`
  <div class="card" onclick="speak('${i.l} is for ${i.w}')">
    <div class="emoji">${i.e}</div>
    <div class="letter">${i.l}</div>
    <div class="word">${i.w}</div>
  </div>
`).join('');

const numbersToShow = [...Array(20).keys()].map(i=>i+1).concat([30,40,50,60,70,80,90,100]);
document.getElementById('numGrid').innerHTML = numbersToShow.map(n=>{
  let dots = n<=10 ? '●'.repeat(n) : n<=20 ? '●'.repeat(10)+' + '+(n-10) : n===100 ? '🎉🎉🎉' : '🔟 x '+(n/10);
  let cls = n===100 ? 'card number-card hundred' : 'card number-card';
  let label = n===100 ? 'ONE HUNDRED!' : n+' '+(n===1?'apple':'apples');
  return `<div class="${cls}" onclick="speak('${n===100?'One hundred! You are a star!':n}')">
    <div class="letter">${n}</div><div class="dots">${dots}</div><div class="word">${label}</div>
  </div>`;
}).join('');

document.getElementById('colorGrid').innerHTML = colors.map(c=>`
  <div class="card color-card" style="background:${c.c}; color:${c.t||'white'}; border-bottom-color:${c.c}" onclick="speak('${c.n}')">
    <span class="emoji">${c.e}</span>
    ${c.n}
  </div>
`).join('');

document.getElementById('animalGrid').innerHTML = animals.map(a=>`
  <div class="card" onclick="speak('${a.n}')">
    <div class="emoji">${a.e}</div>
    <div class="word">${a.n}</div>
  </div>
`).join('');
</script>
</body>
</html>
