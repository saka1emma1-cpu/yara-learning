<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yara Kids - ABC & 123</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b6b">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui}
  body{background:#FFF8E7;min-height:100vh}
  header{background:#FF6B6B;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
  header h1{font-size:28px} header p{opacity:.9;font-size:14px}
  .tabs{display:flex;gap:8px;padding:12px;overflow:auto;background:white;box-shadow:0 2px 8px #0001;position:sticky;top:70px;z-index:9}
  .tab{padding:10px 14px;border-radius:20px;border:2px solid #eee;background:white;font-weight:800;white-space:nowrap;cursor:pointer;font-size:13px}
  .tab.active{background:#FF6B6B;color:white;border-color:#FF6B6B}
  .page{padding:16px;display:none} .page.active{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:white;border-radius:20px;padding:18px 10px;text-align:center;box-shadow:0 4px 12px #0001;cursor:pointer;transition:.2s;border-bottom:5px solid #eee}
  .card:active{transform:scale(.95)}
  .card .emoji{font-size:42px} .card .letter{font-size:26px;font-weight:900;color:#333}
  .card .word{font-size:13px;color:#666;margin-top:4px;font-weight:700}
  .word-card .letter{letter-spacing:2px}
  .word-card .sound{font-size:11px;color:#FF6B6B;font-weight:800;margin-top:4px}
  .number-card .dots{font-size:16px;margin-top:6px;word-break:break-all}
  .color-card{height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-weight:900;text-shadow:0 1px 3px #0008;font-size:14px;gap:4px}
  .color-card span.emoji{font-size:22px;text-shadow:none}
  .color-section{margin-bottom:24px}
  .color-section h3{font-size:15px;margin-bottom:10px;padding:8px 14px;border-radius:20px;display:inline-block;color:white}
  .primary h3{background:#FF3B30} .secondary h3{background:#34C759} .neutral h3{background:#8E8E93} .fancy h3{background:#AF52DE}
  .word-section{margin-bottom:24px}
  .word-section h3{font-size:15px;margin-bottom:10px;padding:8px 14px;border-radius:20px;display:inline-block;color:white}
  .two h3{background:#4ECDC4} .three h3{background:#FF6B6B}
  .mix-hint{font-size:10px;opacity:0.9;font-weight:600;margin-top:2px}
  .speak-btn{margin:16px auto;display:block;background:#4ECDC4;color:white;border:none;padding:12px 24px;border-radius:30px;font-weight:800;font-size:16px}
  .parent{margin:20px 16px;background:white;padding:14px;border-radius:16px;text-align:center}
  .hundred{background:linear-gradient(135deg,#FF6B6B,#FFD93D)!important;color:white!important;border-bottom-color:#FF6B6B!important}
  .hundred .letter,.hundred .word,.hundred .dots{color:white!important}
</style>
</head>
<body>
<header>
  <h1>🌈 Yara Kids</h1>
  <p>Tap to hear sound 🔊 — Now reading!</p>
</header>

<div class="tabs">
  <button class="tab" onclick="showPage('abc', this)">🔤 ABC</button>
  <button class="tab" onclick="showPage('num', this)">🔢 1-100</button>
  <button class="tab active" onclick="showPage('words', this)">📝 Words</button>
  <button class="tab" onclick="showPage('color', this)">🎨 Colors</button>
  <button class="tab" onclick="showPage('animal', this)">🦁 Animals</button>
</div>

<div id="abc" class="page"><div class="grid" id="abcGrid"></div></div>
<div id="num" class="page"><div class="grid" id="numGrid"></div></div>
<div id="words" class="page active"></div>
<div id="color" class="page"></div>
<div id="animal" class="page"><div class="grid" id="animalGrid"></div></div>

<div class="parent">⭐ Today: <span id="learnCount">0</span> words learned — Parent check</div>
<button class="speak-btn" onclick="speakText('Hello little star! You are doing great!')">👋 Say Hello</button>

<script>
const abcData = [
  {l:'A',e:'🍎',w:'Apple'},{l:'B',e:'⚽',w:'Ball'},{l:'C',e:'🐱',w:'Cat'},{l:'D',e:'🐶',w:'Dog'},
  {l:'E',e:'🐘',w:'Elephant'},{l:'F',e:'🐟',w:'Fish'},{l:'G',e:'🍇',w:'Grapes'},{l:'H',e:'🏠',w:'House'},
  {l:'I',e:'🍦',w:'Ice Cream'},{l:'J',e:'🧃',w:'Juice'},{l:'K',e:'🪁',w:'Kite'},{l:'L',e:'🦁',w:'Lion'},
  {l:'M',e:'🐒',w:'Monkey'},{l:'N',e:'🥜',w:'Nut'},{l:'O',e:'🍊',w:'Orange'},{l:'P',e:'🐼',w:'Panda'},
  {l:'Q',e:'👑',w:'Queen'},{l:'R',e:'🌈',w:'Rainbow'},{l:'S',e:'☀️',w:'Sun'},{l:'T',e:'🐯',w:'Tiger'},
  {l:'U',e:'☂️',w:'Umbrella'},{l:'V',e:'🎻',w:'Violin'},{l:'W',e:'🐳',w:'Whale'},{l:'X',e:'🎄',w:'Xmas Tree'},
  {l:'Y',e:'🟡',w:'Yellow'},{l:'Z',e:'🦓',w:'Zebra'}
];

// FIXED LIST - short and clear
const twoLetterWords = [
  {w:'AT',e:'🎩',say:'at'}, {w:'IN',e:'📥',say:'in'}, {w:'ON',e:'🔛',say:'on'},
  {w:'UP',e:'⬆️',say:'up'}, {w:'IT',e:'👉',say:'it'}, {w:'IS',e:'✅',say:'is'},
  {w:'TO',e:'➡️',say:'to'}, {w:'GO',e:'🏃',say:'go'}, {w:'MY',e:'🙋',say:'my'},
  {w:'WE',e:'👫',say:'we'}, {w:'BE',e:'🐝',say:'bee'}, {w:'SO',e:'😊',say:'so'},
  {w:'AN',e:'🍎',say:'an'}, {w:'AM',e:'🕐',say:'am'}, {w:'ME',e:'😊',say:'me'}
];
const threeLetterWords = [
  {w:'CAT',e:'🐱',say:'cat'}, {w:'DOG',e:'🐶',say:'dog'}, {w:'BAT',e:'🦇',say:'bat'},
  {w:'SUN',e:'☀️',say:'sun'}, {w:'HAT',e:'🎩',say:'hat'}, {w:'MAP',e:'🗺️',say:'map'},
  {w:'CUP',e:'☕',say:'cup'}, {w:'BAG',e:'👜',say:'bag'}, {w:'BED',e:'🛏️',say:'bed'},
  {w:'BOX',e:'📦',say:'box'}, {w:'CAR',e:'🚗',say:'car'}, {w:'BUS',e:'🚌',say:'bus'},
  {w:'EGG',e:'🥚',say:'egg'}, {w:'FOX',e:'🦊',say:'fox'}, {w:'PIG',e:'🐷',say:'pig'},
  {w:'COW',e:'🐮',say:'cow'}, {w:'BEE',e:'🐝',say:'bee'}, {w:'ANT',e:'🐜',say:'ant'},
  {w:'TOP',e:'🌀',say:'top'}, {w:'PEN',e:'🖊️',say:'pen'}, {w:'RED',e:'🔴',say:'red'},
  {w:'LEG',e:'🦵',say:'leg'}, {w:'EYE',e:'👁️',say:'eye'}, {w:'EAR',e:'👂',say:'ear'},
  {w:'JAM',e:'🍓',say:'jam'}, {w:'ZIP',e:'🤐',say:'zip'}, {w:'VAN',e:'🚐',say:'van'},
  {w:'MOM',e:'👩',say:'mom'}, {w:'DAD',e:'👨',say:'dad'}, {w:'BOY',e:'👦',say:'boy'}
];

const colorGroups = {
  primary: { title: '🔴 Primary - Mix to make others!', colors: [{n:'Red',c:'#FF3B30',e:'❤️',mix:'Primary'}, {n:'Blue',c:'#007AFF',e:'💙',mix:'Primary'}, {n:'Yellow',c:'#FFCC00',e:'💛',mix:'Primary'}]},
  secondary: { title: '🟢 Secondary - Made by mixing', colors: [{n:'Green',c:'#34C759',e:'💚',mix:'Blue + Yellow'}, {n:'Orange',c:'#FF9500',e:'🧡',mix:'Red + Yellow'}, {n:'Purple',c:'#AF52DE',e:'💜',mix:'Red + Blue'}]},
  neutral: { title: '⚫ Neutral', colors: [{n:'Black',c:'#000000',e:'🖤'}, {n:'White',c:'#FFFFFF',e:'🤍',t:'#333'}, {n:'Gray',c:'#8E8E93',e:'🩶'}, {n:'Brown',c:'#8B4513',e:'🤎'}]},
  fancy: { title: '✨ Fancy Colors', colors: [{n:'Pink',c:'#FF2D55',e:'💗'}, {n:'Gold',c:'#FFD700',e:'⭐'}, {n:'Silver',c:'#C0C0C0',e:'✨'}, {n:'Cyan',c:'#00BCD4',e:'🩵'}, {n:'Lime',c:'#8BC34A',e:'🍋'}, {n:'Magenta',c:'#E91E63',e:'🌺'}, {n:'Maroon',c:'#800000',e:'🍷'}, {n:'Navy',c:'#001F54',e:'🌌'}, {n:'Teal',c:'#008080',e:'🦚'}, {n:'Indigo',c:'#3F51B5',e:'🔮'}, {n:'Violet',c:'#9C27B0',e:'☂️'}, {n:'Lavender',c:'#CE93D8',e:'💐'}, {n:'Peach',c:'#FFCBA4',e:'🍑',t:'#333'}, {n:'Coral',c:'#FF6F61',e:'🪸'}, {n:'Turquoise',c:'#40E0D0',e:'🌊'}]}
};
const animals = [
  {n:'Cat',e:'🐱'}, {n:'Dog',e:'🐶'}, {n:'Lion',e:'🦁'}, {n:'Elephant',e:'🐘'}, {n:'Monkey',e:'🐒'}, {n:'Tiger',e:'🐯'}, {n:'Zebra',e:'🦓'}, {n:'Panda',e:'🐼'}, {n:'Fish',e:'🐟'},
  {n:'Cow',e:'🐮'}, {n:'Horse',e:'🐴'}, {n:'Chicken',e:'🐔'}, {n:'Duck',e:'🦆'}, {n:'Sheep',e:'🐑'}, {n:'Pig',e:'🐷'}, {n:'Goat',e:'🐐'}, {n:'Rabbit',e:'🐰'}, {n:'Bear',e:'🐻'},
  {n:'Giraffe',e:'🦒'}, {n:'Hippo',e:'🦛'}, {n:'Crocodile',e:'🐊'}, {n:'Snake',e:'🐍'}, {n:'Turtle',e:'🐢'}, {n:'Frog',e:'🐸'}, {n:'Mouse',e:'🐭'},
  {n:'Parrot',e:'🦜'}, {n:'Owl',e:'🦉'}, {n:'Penguin',e:'🐧'}, {n:'Eagle',e:'🦅'}, {n:'Peacock',e:'🦚'}, {n:'Flamingo',e:'🦩'}, {n:'Bee',e:'🐝'}, {n:'Butterfly',e:'🦋'},
  {n:'Whale',e:'🐳'}, {n:'Dolphin',e:'🐬'}, {n:'Octopus',e:'🐙'}
];

let count=parseInt(localStorage.getItem('yaraCount')||'0');
document.getElementById('learnCount').innerText=count;

function speakText(t){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.rate=0.85; u.pitch=1.1; u.lang='en-US';
  speechSynthesis.speak(u);
  count++; localStorage.setItem('yaraCount',count);
  document.getElementById('learnCount').innerText=count;
}

// --- NEW CORRECT PRONUNCIATION LOGIC ---
function speakWord(obj){
  speechSynthesis.cancel();

  // Step 1: Spell letters slowly
  const letters = obj.w.split('').join(' . ');
  const u1 = new SpeechSynthesisUtterance(letters);
  u1.rate=0.6; u1.pitch=1.2; u1.lang='en-US';
  
  // Step 2: Say the word clearly after a pause
  u1.onend = () => {
    setTimeout(()=>{
      const u2 = new SpeechSynthesisUtterance(obj.say);
      u2.rate=0.7; u2.pitch=1.1; u2.lang='en-US';
      speechSynthesis.speak(u2);
    }, 400);
  };
  speechSynthesis.speak(u1);

  count++; localStorage.setItem('yaraCount',count);
  document.getElementById('learnCount').innerText=count;
}

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
}

document.getElementById('abcGrid').innerHTML = abcData.map(i=>`<div class="card" onclick="speakText('${i.l} is for ${i.w}')"><div class="emoji">${i.e}</div><div class="letter">${i.l}</div><div class="word">${i.w}</div></div>`).join('');
const numbersToShow=[...Array(20).keys()].map(i=>i+1).concat([30,40,50,60,70,80,90,100]);
document.getElementById('numGrid').innerHTML=numbersToShow.map(n=>{
  let dots=n<=10?'●'.repeat(n):n<=20?'●'.repeat(10)+' + '+(n-10):n===100?'🎉🎉🎉':'🔟 x '+(n/10);
  let cls=n===100?'card number-card hundred':'card number-card';
  let label=n===100?'ONE HUNDRED!':n+' '+(n===1?'apple':'apples');
  return `<div class="${cls}" onclick="speakText('${n===100?'One hundred! You are a star!':n}')"><div class="letter">${n}</div><div class="dots">${dots}</div><div class="word">${label}</div></div>`;
}).join('');

let wordsHTML=`<div class="word-section two"><h3>✌️ 2-Letter Words - Start here!</h3><div class="grid">`;
twoLetterWords.forEach(o=>{
  wordsHTML+=`<div class="card word-card" onclick='speakWord(${JSON.stringify(o)})'><div class="emoji">${o.e}</div><div class="letter">${o.w}</div><div class="sound">${o.w.split('').join(' - ').toLowerCase()}</div></div>`;
});
wordsHTML+=`</div></div><div class="word-section three"><h3>📚 3-Letter Words - You can read!</h3><div class="grid">`;
threeLetterWords.forEach(o=>{
  wordsHTML+=`<div class="card word-card" onclick='speakWord(${JSON.stringify(o)})'><div class="emoji">${o.e}</div><div class="letter">${o.w}</div><div class="sound">${o.w.split('').join(' - ').toLowerCase()}</div></div>`;
});
wordsHTML+=`</div></div>`;
document.getElementById('words').innerHTML=wordsHTML;

let colorHTML=''; for(let k in colorGroups){ let g=colorGroups[k]; colorHTML+=`<div class="color-section ${k}"><h3>${g.title}</h3><div class="grid">`; g.colors.forEach(c=>{ let mix=c.mix?`<div class="mix-hint">${c.mix}</div>`:''; colorHTML+=`<div class="card color-card" style="background:${c.c};color:${c.t||'white'};border-bottom-color:${c.c}" onclick="speakText('${c.n}')"><span class="emoji">${c.e}</span>${c.n}${mix}</div>`; }); colorHTML+=`</div></div>`; }
document.getElementById('color').innerHTML=colorHTML;
document.getElementById('animalGrid').innerHTML=animals.map(a=>`<div class="card" onclick="speakText('${a.n}')"><div class="emoji">${a.e}</div><div class="word">${a.n}</div></div>`).join('');
</script>
</body>
</html>
