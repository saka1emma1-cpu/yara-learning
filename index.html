<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yara Kids - ABC & 123</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',system-ui}
  body{background:#FFF8E7;min-height:100vh}
  header{background:#FF6B6B;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
  header h1{font-size:28px}
  .voice-box{margin:10px 16px;background:#fff3cd;padding:12px;border-radius:12px;border:2px solid #FFCC00}
  .voice-box b{font-size:13px}
  .voice-box p{font-size:11px;margin-top:4px}
  .tabs{display:flex;gap:8px;padding:12px;overflow:auto;background:white;box-shadow:0 2px 8px #0001;position:sticky;top:98px;z-index:9}
  .tab{padding:10px 14px;border-radius:20px;border:2px solid #eee;background:white;font-weight:800;white-space:nowrap;cursor:pointer;font-size:13px}
  .tab.active{background:#FF6B6B;color:white;border-color:#FF6B6B}
  .page{padding:16px;display:none} .page.active{display:block}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .card{background:white;border-radius:20px;padding:18px 10px;text-align:center;box-shadow:0 4px 12px #0001;cursor:pointer;border-bottom:5px solid #eee}
  .card:active{transform:scale(.95)}
  .card .emoji{font-size:42px} .card .letter{font-size:26px;font-weight:900;color:#333}
  .word-card .sound{font-size:11px;color:#FF6B6B;font-weight:800}
  .parent{margin:20px 16px;background:white;padding:14px;border-radius:16px;text-align:center}
  .speak-btn{margin:16px auto;display:block;background:#4ECDC4;color:white;border:none;padding:12px 24px;border-radius:30px;font-weight:800}
</style>
</head>
<body>
<header>
  <h1>🌈 Yara Kids</h1>
  <p>👨‍🏫 Mr. Yara - Your Teacher</p>
</header>

<div class="voice-box">
  <b>👨‍🏫 Teacher Voice: Male (Deep Mode)</b>
  <p>If still female: Go to Phone Settings → Language → Text-to-Speech → Google TTS ⚙️ → Install voice data → English UK → Tap Male voice (Voice II or III) → Download. Then reload.</p>
  <button onclick="testVoice()" style="margin-top:8px;padding:8px 16px;border-radius:20px;border:none;background:#FF6B6B;color:white;font-weight:800">Test Teacher Voice</button>
</div>

<div class="tabs">
  <button class="tab" onclick="showPage('abc', this)">🔤 ABC</button>
  <button class="tab" onclick="showPage('num', this)">🔢 1-100</button>
  <button class="tab active" onclick="showPage('words', this)">📝 Words</button>
  <button class="tab" onclick="showPage('color', this)">🎨 Colors</button>
  <button class="tab" onclick="showPage('animal', this)">🦁 Animals</button>
</div>

<div id="abc" class="page"><div class="grid" id="abcGrid"></div></div>
<div id="num" class="page"><div class="grid" id="numGrid"></div></div>
<div id="words" class="page active"></div>
<div id="color" class="page"></div>
<div id="animal" class="page"><div class="grid" id="animalGrid"></div></div>

<div class="parent">⭐ Today: <span id="learnCount">0</span> words learned</div>

<script>
const abcData = [{l:'A',e:'🍎',w:'Apple'},{l:'B',e:'⚽',w:'Ball'},{l:'C',e:'🐱',w:'Cat'},{l:'D',e:'🐶',w:'Dog'},{l:'E',e:'🐘',w:'Elephant'},{l:'F',e:'🐟',w:'Fish'},{l:'G',e:'🍇',w:'Grapes'},{l:'H',e:'🏠',w:'House'},{l:'I',e:'🍦',w:'Ice Cream'},{l:'J',e:'🧃',w:'Juice'},{l:'K',e:'🪁',w:'Kite'},{l:'L',e:'🦁',w:'Lion'},{l:'M',e:'🐒',w:'Monkey'},{l:'N',e:'🥜',w:'Nut'},{l:'O',e:'🍊',w:'Orange'},{l:'P',e:'🐼',w:'Panda'},{l:'Q',e:'👑',w:'Queen'},{l:'R',e:'🌈',w:'Rainbow'},{l:'S',e:'☀️',w:'Sun'},{l:'T',e:'🐯',w:'Tiger'},{l:'U',e:'☂️',w:'Umbrella'},{l:'V',e:'🎻',w:'Violin'},{l:'W',e:'🐳',w:'Whale'},{l:'X',e:'🎄',w:'Xmas Tree'},{l:'Y',e:'🟡',w:'Yellow'},{l:'Z',e:'🦓',w:'Zebra'}];
const twoLetterWords = [{w:'AT',e:'🎩',say:'at'},{w:'IN',e:'📥',say:'in'},{w:'ON',e:'🔛',say:'on'},{w:'UP',e:'⬆️',say:'up'},{w:'IT',e:'👉',say:'it'},{w:'IS',e:'✅',say:'is'},{w:'TO',e:'➡️',say:'to'},{w:'GO',e:'🏃',say:'go'},{w:'MY',e:'🙋',say:'my'},{w:'WE',e:'👫',say:'we'},{w:'BE',e:'🐝',say:'bee'},{w:'SO',e:'😊',say:'so'},{w:'AN',e:'🍎',say:'an'},{w:'AM',e:'🕐',say:'am'},{w:'ME',e:'😊',say:'me'}];
const threeLetterWords = [{w:'CAT',e:'🐱',say:'cat'},{w:'DOG',e:'🐶',say:'dog'},{w:'BAT',e:'🦇',say:'bat'},{w:'SUN',e:'☀️',say:'sun'},{w:'HAT',e:'🎩',say:'hat'},{w:'MAP',e:'🗺️',say:'map'},{w:'CUP',e:'☕',say:'cup'},{w:'BAG',e:'👜',say:'bag'},{w:'BED',e:'🛏️',say:'bed'},{w:'BOX',e:'📦',say:'box'},{w:'CAR',e:'🚗',say:'car'},{w:'BUS',e:'🚌',say:'bus'},{w:'EGG',e:'🥚',say:'egg'},{w:'FOX',e:'🦊',say:'fox'},{w:'PIG',e:'🐷',say:'pig'},{w:'COW',e:'🐮',say:'cow'},{w:'BEE',e:'🐝',say:'bee'},{w:'ANT',e:'🐜',say:'ant'},{w:'TOP',e:'🌀',say:'top'},{w:'PEN',e:'🖊️',say:'pen'},{w:'RED',e:'🔴',say:'red'}];

let teacherVoice = null;
function initVoice(){
  const voices = speechSynthesis.getVoices();
  if(!voices.length){ setTimeout(initVoice,500); return; }
  // Try to find ANY male
  const male = voices.find(v=>/male|david|mark|alex|guy/i.test(v.name)) || voices.find(v=>v.lang==='en-GB') || voices[0];
  teacherVoice = male;
  console.log('Teacher voice:', male.name);
}
speechSynthesis.onvoiceschanged = initVoice;
initVoice();

function testVoice(){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance("Hello! I am Mister Yara, your teacher. Let's learn together. Repeat after me. A, T, at!");
  if(teacherVoice) u.voice = teacherVoice;
  u.rate = 0.7; // slower = more teacher-like
  u.pitch = 0.5; // 0.5 = DEEP MALE even if base voice is female
  u.volume = 1;
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

function speakText(t){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  if(teacherVoice) u.voice = teacherVoice;
  u.rate=0.75; u.pitch=0.55; u.lang='en-US'; // DEEP MALE EFFECT
  speechSynthesis.speak(u);
}

function speakWord(obj){
  speechSynthesis.cancel();
  const letters = obj.w.split('').join(' . ');
  const u1 = new SpeechSynthesisUtterance(letters);
  if(teacherVoice) u1.voice = teacherVoice;
  u1.rate=0.5; u1.pitch=0.5; u1.lang='en-US';
  u1.onend = ()=>{
    setTimeout(()=>{
      const u2 = new SpeechSynthesisUtterance(`The word is ${obj.say}. Say it with me, ${obj.say}`);
      if(teacherVoice) u2.voice = teacherVoice;
      u2.rate=0.65; u2.pitch=0.6; u2.lang='en-US';
      speechSynthesis.speak(u2);
    },300);
  };
  speechSynthesis.speak(u1);
}

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
}

document.getElementById('abcGrid').innerHTML = abcData.map(i=>`<div class="card" onclick="speakText('${i.l} is for ${i.w}. ${i.w}')"><div class="emoji">${i.e}</div><div class="letter">${i.l}</div></div>`).join('');
let wordsHTML=`<div class="grid">`;
twoLetterWords.forEach(o=>{ wordsHTML+=`<div class="card" onclick='speakWord(${JSON.stringify(o)})'><div class="emoji">${o.e}</div><div class="letter">${o.w}</div><div class="sound">${o.w.split('').join(' - ')}</div></div>`; });
threeLetterWords.forEach(o=>{ wordsHTML+=`<div class="card" onclick='speakWord(${JSON.stringify(o)})'><div class="emoji">${o.e}</div><div class="letter">${o.w}</div><div class="sound">${o.w.split('').join(' - ')}</div></div>`; });
wordsHTML+=`</div>`;
document.getElementById('words').innerHTML=wordsHTML;
document.getElementById('numGrid').innerHTML=`<div class="card" onclick="speakText('One')"><div class="letter">1</div></div>`;
document.getElementById('color').innerHTML=`<div class="card" onclick="speakText('Red')"><div class="letter">Red</div></div>`;
document.getElementById('animalGrid').innerHTML=`<div class="card" onclick="speakText('Cat')"><div class="letter">Cat</div></div>`;
</script>
</body>
</html>
